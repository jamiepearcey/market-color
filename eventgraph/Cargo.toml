[package]
name = "eventgraph"
version = "0.1.0"
edition = "2021"
description = "Financial event/sensitivity knowledge graph: feeds -> narrative extraction -> Postgres reference model + DuckLake analytical facts"

[[bin]]
name = "eventgraph"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
ureq = { version = "2", features = ["json"] }

# --- scrape job (feed-scraping -> date-partitioned Parquet) ---
feed-rs = "2"
scraper = "0.20"
base64 = "0.22"
sha2 = "0.10"
url = "2"
regex = "1"
rayon = "1"
arrow = "53"
parquet = "53"

[features]
# Optional Temporal orchestration drop-in (see src/scrape/temporal.rs). Off by
# default: the standalone rayon runner is the shipped orchestrator. Enabling this
# only compiles a documented worker skeleton; it does NOT pull a Temporal SDK.
temporal = []

# Notes:
# - Feeds read raw-doc JSONL by default; a Parquet feed (arrow/parquet) is a
#   follow-on (see feed.rs).
# - Postgres load = generated SQL applied via `psql` (no live driver dep yet).
# - DuckLake export = per-table JSONL + generated SQL applied via the `duckdb`
#   CLI (no native libduckdb dep). Both are integration-swappable later.
