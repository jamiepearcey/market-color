<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>eventgraph · causal graph</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body, #root { margin: 0; height: 100%; background: #0d1117; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #e6edf3; overflow: hidden; }

    .panel {
      position: fixed; z-index: 10;
      background: rgba(22,27,34,0.82); backdrop-filter: blur(12px);
      border: 1px solid #30363d; border-radius: 14px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.45);
    }
    .left { top: 16px; left: 16px; width: 320px; padding: 16px 16px 14px; }
    .left h1 { margin: 0; font-size: 17px; letter-spacing: .2px; }
    .left .sub { color: #8b98a5; font-size: 12px; margin: 4px 0 12px; }
    .searchrow { display: flex; gap: 6px; }
    .searchrow input {
      flex: 1; background: #0d1117; border: 1px solid #30363d; color: #e6edf3;
      border-radius: 8px; padding: 8px 10px; font-size: 13px; outline: none;
    }
    .searchrow input:focus { border-color: #4c9be8; }
    .searchrow button { background: #21262d; border: 1px solid #30363d; color: #e6edf3; border-radius: 8px; width: 34px; cursor: pointer; }
    .legend { display: flex; flex-wrap: wrap; gap: 5px; margin: 12px 0 8px; }
    .lg {
      display: inline-flex; align-items: center; gap: 5px; cursor: pointer;
      background: #0d1117; border: 1px solid #30363d; color: #c9d1d9;
      border-radius: 20px; padding: 3px 9px 3px 6px; font-size: 11px; transition: .12s;
    }
    .lg:hover { border-color: #4c9be8; }
    .lg.off { opacity: .32; text-decoration: line-through; }
    .lg i { width: 9px; height: 9px; border-radius: 50%; }
    .hint { color: #6b7683; font-size: 11px; margin-top: 8px; line-height: 1.5; }

    .right { top: 16px; right: 16px; width: 340px; max-height: calc(100vh - 32px); padding: 18px; overflow-y: auto; }
    .right .x { position: absolute; top: 12px; right: 12px; background: none; border: none; color: #8b98a5; font-size: 20px; cursor: pointer; line-height: 1; }
    .right h2 { margin: 0 26px 8px 0; font-size: 19px; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .tag { font-size: 11px; padding: 2px 9px; border-radius: 20px; border: 1px solid #30363d; color: #c9d1d9; }
    .tag.tick { background: #1f6feb22; border-color: #1f6feb; color: #79c0ff; font-weight: 600; }
    .section h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: #8b98a5; margin: 16px 0 8px; }
    .edge { border-left: 2px solid #30363d; padding: 4px 0 6px 10px; margin-bottom: 8px; }
    .edgehead { font-size: 13px; }
    .edgehead .mech { color: #8b98a5; font-size: 11px; }
    .quote { color: #adbac7; font-size: 12px; font-style: italic; margin-top: 3px; line-height: 1.45; }
    ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 8px; }

    .time { left: 16px; right: 16px; bottom: 16px; padding: 10px 14px 12px; }
    @media (min-width: 900px){ .time { left: 356px; } }
    .timehead { display: flex; align-items: center; gap: 14px; font-size: 12px; color: #c9d1d9; margin-bottom: 8px; flex-wrap: wrap; }
    .timehead .win { font-weight: 600; color: #e6edf3; font-variant-numeric: tabular-nums; }
    .timehead .cnt { color: #8b98a5; }
    .play { background: #21262d; border: 1px solid #30363d; color: #e6edf3; border-radius: 8px; width: 30px; height: 26px; cursor: pointer; font-size: 12px; }
    .play:hover { border-color: #4c9be8; }
    .ctl { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; }
    .chip { background: #0d1117; border: 1px solid #30363d; color: #c9d1d9; border-radius: 7px; padding: 3px 9px; font-size: 11px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
    .chip.off { opacity: .38; text-decoration: line-through; }
    .chip i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
    .chip i.dash { background: repeating-linear-gradient(90deg,#e15759 0 3px,transparent 3px 6px); height: 2px; }
    select.mode { background: #0d1117; color: #e6edf3; border: 1px solid #30363d; border-radius: 7px; padding: 3px 6px; font-size: 11px; }
    .hist { position: relative; height: 46px; display: flex; align-items: flex-end; gap: 1px; }
    .hist .bar { flex: 1; background: #2b3441; border-radius: 1px 1px 0 0; min-height: 1px; transition: background .1s; }
    .hist .bar.on { background: #4c9be8; }
    .sliders { position: relative; height: 16px; margin-top: 2px; }
    .sliders input { position: absolute; width: 100%; margin: 0; -webkit-appearance: none; background: transparent; pointer-events: none; }
    .sliders input::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #e6edf3; border: 2px solid #1f6feb; cursor: pointer; pointer-events: auto; }
    .sliders input::-webkit-slider-runnable-track { height: 3px; background: #30363d; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
