[package]
name = "receptors"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "receptors"
path = "src/main.rs"

[dependencies]
ndarray = { version = "0.15", features = ["blas"] }
blas-src = { version = "0.10", features = ["accelerate"] }
nalgebra = "0.33"
ndarray-npy = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
opt-level = 3
